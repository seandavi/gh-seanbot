# Copy to a gitignored policy.toml and replace placeholders.
# Create the audit parent directory privately before running.
audit_log = "/absolute/private/path/audit.jsonl"

[app]
client_id = "Iv1.REPLACE_ME"
installation_id = 123456
private_key = "/absolute/private/path/app.pem"

[repositories]
"OWNER/TEST_REPOSITORY" = ["read", "issues", "pull-requests", "push"]
# Opt into "merge" or the broader "contribute" only after approving merge/write policy.

# Optional. Push branches must start with a listed prefix ending in "/"; the default is ["agent/"].
[push_branch_prefixes]
"OWNER/TEST_REPOSITORY" = ["agent/"]
