[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gh-seanbot"
version = "0.1.0"
description = "Scoped GitHub App credentials and agent provenance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "PyJWT[crypto]>=2.10,<3"]

[project.scripts]
gh-seanbot = "gh_seanbot.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
